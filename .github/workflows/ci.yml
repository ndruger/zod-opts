name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: [22, 24, 26]
        os: [ubuntu-latest]
        zod: ["3", "4"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          cache: "npm"
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run lint
      - name: Typecheck (Zod ${{ matrix.zod }})
        run: npm run typecheck:zod${{ matrix.zod }}
      - name: Test with coverage (Zod ${{ matrix.zod }})
        run: npm run test_cov:zod${{ matrix.zod }} # ts-jest doesn't need build js files
      - name: Upload coverage reports to Codecov
        # Dependabot PRs can't read CODECOV_TOKEN
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
